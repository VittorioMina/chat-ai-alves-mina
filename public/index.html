<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandacaru · monitor de Algoritmos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌵</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/index.css" />
    <!-- marked: converte o Markdown das respostas em HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- DOMPurify (Desafio 9): limpa o HTML antes de inserir na página -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <!-- defer: o main.js só roda depois que o HTML estiver montado -->
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="topo">
        <div class="marca">
          <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M21 44V10a3 3 0 0 1 6 0v34" />
            <path d="M21 30h-6a3 3 0 0 1-3-3V18a2.5 2.5 0 0 1 5 0v7h4" />
            <path d="M27 24h5V14a2.5 2.5 0 0 1 5 0v10a3 3 0 0 1-3 3h-7" />
            <circle class="flor" cx="24" cy="6" r="3" />
          </svg>
          <div>
            <h1>Mandacaru</h1>
            <p class="subtitulo">Monitor de Algoritmos do ADS, IFBA Irecê</p>
          </div>
        </div>

        <div class="controles">
          <!-- Desafio 4: seletor de modelos (opções vêm de /api/models) -->
          <label class="campo">
            <span>Modelo</span>
            <select id="selectModel" aria-label="Modelo">
              <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
              <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
            </select>
          </label>
          <!-- Desafio 7: liga e desliga o streaming -->
          <label class="chave">
            <input type="checkbox" id="toggleStream" checked />
            <span>Texto em tempo real</span>
          </label>
          <button id="btnReset" class="botao-secundario" type="button">Nova conversa</button>
        </div>
      </header>

      <main class="conversa">
        <div class="chat-area" id="chatArea" aria-live="polite"></div>

        <!-- tela vazia: some quando a primeira mensagem aparece -->
        <section class="empty-chat" id="emptyChat">
          <h2>Travou em algum exercício?</h2>
          <p>Pergunte sobre algoritmos, estruturas de dados ou o seu código em C. Exercício de lista ganha dica primeiro.</p>
          <div class="sugestoes">
            <button type="button" class="sugestao">O que é recursividade?</button>
            <button type="button" class="sugestao">Qual a diferença entre pilha e fila?</button>
            <button type="button" class="sugestao">Como funciona um ponteiro em C?</button>
          </div>
        </section>
      </main>

      <footer class="rodape">
        <div class="form-area">
          <textarea
            id="inputMessage"
            rows="1"
            placeholder="Digite sua pergunta"
            aria-label="Mensagem"
          ></textarea>
          <button id="btnSend" type="button">Enviar</button>
        </div>
        <!-- Desafio 5: painel de tokens e custo da sessão -->
        <div class="painel" id="painelUso">
          <span>Tokens na sessão: <strong id="usoTokens">0</strong></span>
          <span>Custo: <strong id="usoCusto">US$ 0,000000</strong></span>
          <span>1.000 conversas como esta: <strong id="usoProjecao">US$ 0,00</strong></span>
        </div>
      </footer>
    </div>
  </body>
</html>
